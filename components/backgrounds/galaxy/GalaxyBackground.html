<div class="zeura-galaxy-container" id="galaxyWrapper">
  <canvas class="zeura-galaxy-canvas" id="galaxyCanvas"></canvas>
  <div class="zeura-galaxy-content">
    <h2 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; text-shadow: 0 0 20px rgba(168,85,247,0.5);">Spiral Galaxy Canvas</h2>
    <p style="font-size: 0.875rem; color: #cbd5e1; opacity: 0.85;">Deep cosmic spiral galaxy with 800+ stars</p>
  </div>
</div>

<script>
(function() {
  const container = document.getElementById('galaxyWrapper');
  const canvas = document.getElementById('galaxyCanvas');
  if (!canvas || !container) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  const starCount = 900;
  const armCount = 3;
  const colors = ['#ffffff', '#fef08a', '#38bdf8', '#818cf8', '#c084fc', '#f472b6'];
  const stars = [];

  for (let i = 0; i < starCount; i++) {
    const typeRand = Math.random();
    let radiusRatio, armIndex = Math.floor(Math.random() * armCount);
    let angularScatter = 0, radialScatter = 0, size = Math.random() * 1.4 + 0.6;
    let hasGlow = false, color = colors[Math.floor(Math.random() * colors.length)];
    let baseAlpha = Math.random() * 0.5 + 0.45;

    if (typeRand < 0.25) {
      radiusRatio = Math.pow(Math.random(), 2.2) * 0.18;
      angularScatter = (Math.random() - 0.5) * Math.PI * 2;
      size = Math.random() * 2.0 + 1.2;
      hasGlow = Math.random() < 0.65;
      color = Math.random() < 0.5 ? '#ffffff' : Math.random() < 0.8 ? '#fef08a' : '#a5f3fc';
      baseAlpha = Math.random() * 0.35 + 0.65;
    } else if (typeRand < 0.9) {
      radiusRatio = 0.12 + Math.pow(Math.random(), 0.95) * 0.88;
      angularScatter = (Math.random() + Math.random() - 1) * (0.28 * (radiusRatio + 0.25));
      radialScatter = (Math.random() - 0.5) * 0.08;
      color = radiusRatio < 0.35 ? (Math.random() < 0.6 ? '#38bdf8' : '#818cf8') :
              radiusRatio < 0.7 ? (Math.random() < 0.6 ? '#c084fc' : '#e879f9') :
              (Math.random() < 0.5 ? '#f472b6' : '#93c5fd');
      hasGlow = Math.random() < 0.25;
      if (hasGlow) size += 0.5;
    } else {
      radiusRatio = Math.random() * 1.15;
      angularScatter = (Math.random() - 0.5) * Math.PI * 2;
      size = Math.random() * 0.8 + 0.4;
      baseAlpha = Math.random() * 0.3 + 0.2;
      color = '#cbd5e1';
    }

    stars.push({
      radiusRatio,
      angle: (armIndex * (Math.PI * 2)) / armCount,
      angularScatter,
      radialScatter,
      size,
      color,
      baseAlpha,
      twinklePhase: Math.random() * Math.PI * 2,
      twinkleFreq: Math.random() * 1.8 + 0.8,
      hasGlow,
      orbitRate: 1 / Math.sqrt(radiusRatio * 4 + 0.4)
    });
  }

  let width = 0, height = 0, dpr = 1;
  function resize() {
    const rect = container.getBoundingClientRect();
    width = Math.max(1, Math.floor(rect.width));
    height = Math.max(1, Math.floor(rect.height));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  let globalRotation = 0, lastTime = performance.now();
  function render(currentTime) {
    const deltaTime = Math.min(currentTime - lastTime, 64) * 0.001;
    lastTime = currentTime;
    globalRotation += deltaTime * 0.12 * 0.6;

    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.fillStyle = '#0a0e27';
    ctx.fillRect(0, 0, width, height);

    const cx = width / 2, cy = height / 2;
    const maxRadius = Math.min(width, height) * 0.48;

    // Nebula dust clouds
    const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(30, maxRadius * 0.35));
    coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
    coreGrad.addColorStop(0.2, 'rgba(168, 85, 247, 0.4)');
    coreGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.25)');
    coreGrad.addColorStop(1, 'rgba(10, 14, 39, 0)');
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(30, maxRadius * 0.35), 0, Math.PI * 2);
    ctx.fill();

    const armGrad = ctx.createRadialGradient(cx, cy, maxRadius * 0.2, cx, cy, maxRadius * 0.95);
    armGrad.addColorStop(0, 'rgba(192, 132, 252, 0.18)');
    armGrad.addColorStop(0.5, 'rgba(244, 114, 182, 0.14)');
    armGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = armGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, maxRadius * 0.95, 0, Math.PI * 2);
    ctx.fill();

    // Draw stars
    const pitchRatio = 0.76;
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const dynamicAngle = s.angle + globalRotation * s.orbitRate + s.angularScatter + Math.pow(s.radiusRatio, 0.72) * 3.6;
      const effectiveRadius = Math.max(0, (s.radiusRatio + s.radialScatter) * maxRadius);
      const x = cx + Math.cos(dynamicAngle) * effectiveRadius;
      const y = cy + Math.sin(dynamicAngle) * (effectiveRadius * pitchRatio);
      const twinkle = 0.65 + 0.35 * Math.sin(currentTime * 0.003 * s.twinkleFreq + s.twinklePhase);

      ctx.save();
      ctx.globalAlpha = Math.min(1, Math.max(0.1, s.baseAlpha * twinkle));
      if (s.hasGlow) {
        ctx.shadowBlur = 8;
        ctx.shadowColor = s.color;
      }
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(x, y, s.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Core star
    ctx.save();
    ctx.shadowBlur = 18;
    ctx.shadowColor = '#ffffff';
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cx, cy, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.restore();
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
